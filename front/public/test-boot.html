<!DOCTYPE html>
<html>
<head>
    <title>Boot Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>Boot Files Loading Test</h1>
    <div id="status">Loading...</div>
    <div id="logs"></div>
    
    <script>
        // 拦截 console.log 来显示日志
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        const logContainer = document.getElementById('logs');
        
        function addLog(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addLog(args.join(' '), 'info');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addLog(args.join(' '), 'error');
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addLog(args.join(' '), 'warning');
        };
        
        // 监听页面加载
        window.addEventListener('load', () => {
            document.getElementById('status').textContent = 'Page loaded. Check logs below for boot file loading status.';
        });
    </script>
    
    <!-- 引入主应用 -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
