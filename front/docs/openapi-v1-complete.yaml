openapi: 3.0.3
info:
  title: MyNet API
  description: |
    MyNet 是一个基于 DDD 架构的虚拟网络管理平台 API。
    
    支持功能：
    - 节点管理（Node Management）
    - 路由管理（Route Management）
    - 区域管理（Zone Management）
    - IP 池管理（IP Pool Management）
    - 社交网络（Social Network）
    - 用户管理（User Management）
    - ID 管理（ID Management）
    
    认证方式：
    - Bearer Token (Laravel Sanctum)
    - Session Authentication
    
    Zone 隔离：
    - 所有 API 都基于用户的 Zone 进行数据隔离
    - 确保跨 Zone 访问的安全性
  version: 1.0.0
  contact:
    name: MyNet API Support
    url: https://github.com/mynet-project
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.mynet.com/api/v1
    description: Production server
  - url: https://staging.mynet.com/api/v1
    description: Staging server
  - url: http://localhost:8000/api/v1
    description: Development server

security:
  - bearerAuth: []
  - sessionAuth: []

paths:
  # 认证相关
  /auth/login:
    post:
      tags:
        - Authentication
      summary: 用户登录
      description: 用户登录获取访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: 用户邮箱
                password:
                  type: string
                  format: password
                  description: 用户密码
                remember:
                  type: boolean
                  description: 记住登录状态
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: 用户登出
      description: 用户登出并撤销令牌
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/verify-token:
    get:
      tags:
        - Authentication
      summary: 验证令牌
      description: 验证当前访问令牌的有效性
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 令牌有效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerifyResponse'

  # 用户信息
  /user:
    get:
      tags:
        - User
      summary: 获取当前用户信息
      description: 获取当前认证用户的基本信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 用户信息获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'

  # MyNet 统计数据
  /mynet/stats:
    get:
      tags:
        - MyNet
      summary: 获取系统统计数据
      description: 获取系统初始化数据和统计信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 统计数据获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyNetStatsResponse'

  /mynet/health:
    get:
      tags:
        - MyNet
      summary: 获取系统健康状态
      description: 获取系统健康状态和运行状态
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 健康状态获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # 节点管理
  /nodes:
    get:
      tags:
        - Nodes
      summary: 获取节点列表
      description: 获取当前用户在当前 Zone 的节点列表
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
          description: 搜索关键词
        - name: vpn_type
          in: query
          schema:
            type: string
            enum: [gnb, wireguard]
          description: VPN 类型筛选
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1, 2]
          description: 状态筛选
      responses:
        '200':
          description: 节点列表获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeListResponse'

    post:
      tags:
        - Nodes
      summary: 创建新节点
      description: 创建新的节点
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
      responses:
        '201':
          description: 节点创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '422':
          description: 验证错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /nodes/{id}:
    get:
      tags:
        - Nodes
      summary: 获取节点详情
      description: 获取指定节点的详细信息
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      responses:
        '200':
          description: 节点详情获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '404':
          description: 节点不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Nodes
      summary: 更新节点
      description: 更新指定节点的信息
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeRequest'
      responses:
        '200':
          description: 节点更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'

    delete:
      tags:
        - Nodes
      summary: 删除节点
      description: 删除指定节点
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      responses:
        '200':
          description: 节点删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # 节点配置管理
  /nodes/{id}/config:
    get:
      tags:
        - Nodes
      summary: 获取节点配置
      description: 获取指定节点的完整配置信息
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      responses:
        '200':
          description: 配置获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeConfigResponse'

    put:
      tags:
        - Nodes
      summary: 保存节点配置
      description: 保存节点的基本信息和自定义配置
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveNodeConfigRequest'
      responses:
        '200':
          description: 配置保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeConfigResponse'

  # 节点密钥管理
  /nodes/{id}/keys/generate:
    post:
      tags:
        - Nodes
      summary: 生成节点密钥
      description: 为指定节点生成密钥对
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateNodeKeyRequest'
      responses:
        '200':
          description: 密钥生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeKeyResponse'

  /nodes/{id}/keys:
    get:
      tags:
        - Nodes
      summary: 获取节点密钥
      description: 获取指定节点的密钥信息
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      responses:
        '200':
          description: 密钥获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeKeyResponse'

    delete:
      tags:
        - Nodes
      summary: 撤销节点密钥
      description: 撤销指定节点的密钥
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      responses:
        '200':
          description: 密钥撤销成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # 节点网络配置
  /nodes/{id}/network-config:
    get:
      tags:
        - Nodes
      summary: 获取节点网络配置
      description: 获取指定节点的网络配置信息
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      responses:
        '200':
          description: 网络配置获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeNetworkConfigResponse'

    put:
      tags:
        - Nodes
      summary: 设置节点网络配置
      description: 设置指定节点的网络配置
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNodeNetworkConfigRequest'
      responses:
        '200':
          description: 网络配置设置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeNetworkConfigResponse'

  # 路由管理
  /routes:
    get:
      tags:
        - Routes
      summary: 获取路由列表
      description: 获取当前用户的路由列表
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: 路由列表获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteListResponse'

    post:
      tags:
        - Routes
      summary: 创建新路由
      description: 创建新的路由连接
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteRequest'
      responses:
        '201':
          description: 路由创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'

  # 区域管理
  /zones:
    get:
      tags:
        - Zones
      summary: 获取区域列表
      description: 获取用户可访问的区域列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 区域列表获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneListResponse'

  # IP 池管理
  /ippools:
    get:
      tags:
        - IP Pools
      summary: 获取 IP 池列表
      description: 获取当前用户的 IP 池列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: IP 池列表获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPPoolListResponse'

    post:
      tags:
        - IP Pools
      summary: 创建 IP 池
      description: 创建新的 IP 池
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIPPoolRequest'
      responses:
        '201':
          description: IP 池创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPPoolResponse'

  # 社交网络
  /social/data:
    get:
      tags:
        - Social
      summary: 获取社交数据概览
      description: 获取用户的社交网络数据概览
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 社交数据获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialDataResponse'

  /social/friends:
    get:
      tags:
        - Social
      summary: 获取好友列表
      description: 获取用户的好友列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 好友列表获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendListResponse'

  /social/friend-request:
    post:
      tags:
        - Social
      summary: 发送好友申请
      description: 向指定用户发送好友申请
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendFriendRequestRequest'
      responses:
        '200':
          description: 好友申请发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ID 管理
  /ids/generate:
    post:
      tags:
        - ID Management
      summary: 生成唯一 ID
      description: 生成全局唯一 ID
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateIDRequest'
      responses:
        '200':
          description: ID 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateIDResponse'

  # 用户节点和区域管理
  /users/{id}/nodes:
    get:
      tags:
        - User
      summary: 获取指定用户的节点列表
      description: 获取指定用户拥有的所有节点列表
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 用户 ID
      responses:
        '200':
          description: 用户节点列表获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNodesResponse'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}/zones:
    get:
      tags:
        - User
      summary: 获取指定用户的区域列表
      description: 获取指定用户可访问的区域列表
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 用户 ID
      responses:
        '200':
          description: 用户区域列表获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserZonesResponse'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Laravel Sanctum Bearer Token
    sessionAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel Session Cookie

  schemas:
    # 通用响应
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "操作成功"
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "操作失败"
        error:
          type: string
          example: "详细错误信息"

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "验证失败"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        to:
          type: integer
        total:
          type: integer

    # 认证相关
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "登录成功"
        data:
          type: object
          properties:
            token:
              type: string
              example: "1|abc123def456..."
            user:
              $ref: '#/components/schemas/User'

    TokenVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "令牌有效"
        data:
          type: object
          properties:
            valid:
              type: boolean
              example: true
            user:
              $ref: '#/components/schemas/User'

    UserInfoResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/User'

    # 用户相关
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        name:
          type: string
          example: "张三"
        email:
          type: string
          format: email
          example: "zhangsan@example.com"
        zone_id:
          type: integer
          example: 1

    # MyNet 统计
    MyNetStatsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            nodes_count:
              type: integer
              example: 10
            routes_count:
              type: integer
              example: 25
            active_connections:
              type: integer
              example: 15
            total_traffic:
              type: integer
              example: 1048576

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: "healthy"
            version:
              type: string
              example: "1.0.0"
            uptime:
              type: integer
              example: 3600

    # 节点相关
    Node:
      type: object
      properties:
        node_id:
          type: integer
          example: 1001
        node_name:
          type: string
          example: "节点名称"
        user_id:
          type: integer
          example: 1001
        zone_id:
          type: integer
          example: 1
        vpn_type:
          type: string
          enum: [gnb, wireguard]
          example: "gnb"
        node_type:
          type: integer
          example: 1
        node_status:
          type: integer
          enum: [0, 1, 2]
          example: 1
        endpoint:
          type: string
          example: "192.168.1.100:9001"
        node_port:
          type: integer
          example: 9001
        node_ip:
          type: string
          example: "10.0.0.1"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NodeListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    NodeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Node'

    CreateNodeRequest:
      type: object
      required:
        - node_name
        - vpn_type
      properties:
        node_name:
          type: string
          example: "新节点"
        vpn_type:
          type: string
          enum: [gnb, wireguard]
          example: "gnb"
        node_type:
          type: integer
          example: 1
        endpoint:
          type: string
          example: "192.168.1.100:9001"
        node_port:
          type: integer
          example: 9001
        node_remarks:
          type: string
          example: "节点备注"

    UpdateNodeRequest:
      type: object
      properties:
        node_name:
          type: string
          example: "更新后的节点名称"
        vpn_type:
          type: string
          enum: [gnb, wireguard]
          example: "gnb"
        endpoint:
          type: string
          example: "192.168.1.100:9001"
        node_port:
          type: integer
          example: 9001
        node_remarks:
          type: string
          example: "更新后的节点备注"

    # 节点配置相关
    NodeConfigResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            node_info:
              type: object
              properties:
                node_id:
                  type: integer
                  example: 1001
                node_name:
                  type: string
                  example: "节点名称"
                vpn_type:
                  type: string
                  example: "gnb"
                node_type:
                  type: integer
                  example: 1
                endpoint:
                  type: string
                  example: "192.168.1.100:9001"
                node_port:
                  type: integer
                  example: 9001
            network_config:
              type: object
              properties:
                ifname:
                  type: string
                  example: "gnb0"
                virtual_ip:
                  type: string
                  example: "10.0.0.1"
                ip_group_sequence_number:
                  type: integer
                  example: 1
            additional_config:
              type: object
              properties:
                node_remarks:
                  type: string
                  example: "节点备注"
                node_app_version:
                  type: string
                  example: "1.0.0"
                node_status:
                  type: integer
                  example: 1
            custom_config:
              type: array
              items:
                type: object
                properties:
                  k:
                    type: string
                    example: "listen"
                  n:
                    type: string
                    example: "监听端口"
                  v:
                    type: string
                    example: "9001"
                  e:
                    type: object
                    properties:
                      desc:
                        type: string
                        example: "节点监听的端口号"
                      memo:
                        type: string
                        example: "通过API更新"

    SaveNodeConfigRequest:
      type: object
      properties:
        node_name:
          type: string
          example: "节点名称"
        vpn_type:
          type: string
          enum: [gnb, wireguard, openvpn]
          example: "gnb"
        endpoint:
          type: string
          example: "192.168.1.100:9001"
        node_port:
          type: integer
          example: 9001
        ifname:
          type: string
          example: "gnb0"
        virtual_ip:
          type: string
          example: "10.0.0.1"
        ip_group_sequence_number:
          type: integer
          example: 1
        node_remarks:
          type: string
          example: "节点备注"
        node_app_version:
          type: string
          example: "1.0.0"
        node_status:
          type: integer
          enum: [0, 1, 2]
          example: 1
        custom_config:
          type: object
          additionalProperties:
            type: string
          example:
            listen: "9001"
            ifname: "gnb0"
            daemon: "1"

    # 节点密钥相关
    NodeKeyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            node_id:
              type: integer
              example: 1001
            key_type:
              type: string
              enum: [ed25519, wireguard, gnb]
              example: "ed25519"
            public_key:
              type: string
              example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJb..."
            private_key:
              type: string
              example: "-----BEGIN OPENSSH PRIVATE KEY-----..."
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    GenerateNodeKeyRequest:
      type: object
      properties:
        key_type:
          type: string
          enum: [ed25519, wireguard, gnb]
          example: "ed25519"
        force_regenerate:
          type: boolean
          example: false
        custom_private_key:
          type: string
          example: "-----BEGIN OPENSSH PRIVATE KEY-----..."
        custom_public_key:
          type: string
          example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJb..."

    # 节点网络配置相关
    NodeNetworkConfigResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            ifname:
              type: string
              example: "gnb0"
            node_ip:
              type: string
              example: "10.0.0.1"
            ip_group_sequence_number:
              type: integer
              example: 1
            lan_ips:
              type: array
              items:
                type: string
              example: ["192.168.1.0/24"]
            public_ips:
              type: array
              items:
                type: string
              example: ["203.0.113.1"]

    SetNodeNetworkConfigRequest:
      type: object
      properties:
        ifname:
          type: string
          example: "gnb0"
        node_ip:
          type: string
          example: "10.0.0.1"
        ip_group_sequence_number:
          type: integer
          example: 1
        lan_ips:
          type: array
          items:
            type: string
          example: ["192.168.1.0/24"]
        public_ips:
          type: array
          items:
            type: string
          example: ["203.0.113.1"]

    # 路由相关
    Route:
      type: object
      properties:
        route_id:
          type: integer
          example: 1001
        source_node_id:
          type: integer
          example: 1001
        target_node_id:
          type: integer
          example: 1002
        status:
          type: string
          enum: [pending, active, inactive]
          example: "active"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RouteListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    RouteResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Route'

    CreateRouteRequest:
      type: object
      required:
        - source_node_id
        - target_node_id
      properties:
        source_node_id:
          type: integer
          example: 1001
        target_node_id:
          type: integer
          example: 1002
        description:
          type: string
          example: "路由描述"

    # 区域相关
    Zone:
      type: object
      properties:
        zone_id:
          type: integer
          example: 1
        zone_name:
          type: string
          example: "默认区域"
        description:
          type: string
          example: "区域描述"
        created_at:
          type: string
          format: date-time

    ZoneListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Zone'

    # IP 池相关
    IPPool:
      type: object
      properties:
        ip_pool_id:
          type: integer
          example: 1
        ip_group_sequence:
          type: integer
          example: 1
        ip_range:
          type: string
          example: "10.0.0.0/24"
        available_ips:
          type: integer
          example: 254
        used_ips:
          type: integer
          example: 10
        created_at:
          type: string
          format: date-time

    IPPoolListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/IPPool'

    IPPoolResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/IPPool'

    CreateIPPoolRequest:
      type: object
      required:
        - ip_range
      properties:
        ip_range:
          type: string
          example: "10.0.0.0/24"
        description:
          type: string
          example: "IP 池描述"

    # 社交网络相关
    SocialDataResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            friends_count:
              type: integer
              example: 10
            pending_requests:
              type: integer
              example: 2
            shared_nodes:
              type: integer
              example: 5

    Friend:
      type: object
      properties:
        user_id:
          type: integer
          example: 1001
        name:
          type: string
          example: "好友名称"
        email:
          type: string
          example: "friend@example.com"
        status:
          type: string
          enum: [active, pending]
          example: "active"
        created_at:
          type: string
          format: date-time

    FriendListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Friend'

    SendFriendRequestRequest:
      type: object
      required:
        - target_user_id
      properties:
        target_user_id:
          type: integer
          example: 1002
        message:
          type: string
          example: "好友申请消息"

    # ID 管理相关
    GenerateIDRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [node, user, zone, route]
          example: "node"
        count:
          type: integer
          default: 1
          example: 1

    GenerateIDResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            ids:
              type: array
              items:
                type: integer
              example: [1001, 1002]
            type:
              type: string
              example: "node"
            count:
              type: integer
              example: 2

    UserNodesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "User nodes retrieved successfully"
        data:
          type: array
          items:
            type: object
            properties:
              node_id:
                type: integer
                example: 1001
              node_name:
                type: string
                example: "用户节点"
              vpn_type:
                type: string
                enum: [gnb, wireguard]
                example: "gnb"
              node_type:
                type: integer
                example: 1
              node_status:
                type: integer
                enum: [0, 1, 2]
                example: 1
              endpoint:
                type: string
                example: "192.168.1.100:9001"
              node_port:
                type: integer
                example: 9001
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time

    UserZonesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "User zones retrieved successfully"
        data:
          type: array
          items:
            type: object
            properties:
              zone_id:
                type: integer
                example: 1
              zone_name:
                type: string
                example: "用户区域"
              description:
                type: string
                example: "区域描述"
              is_primary:
                type: boolean
                example: true
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time

