server {
    listen 80;
    listen [::]:80;
    server_name my.mynet.club;

    # 强制重定向到HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 172.26.3.227:443 ssl http2;
    listen [::]:443 ssl http2;
    listen 127.0.0.1:443 ssl http2;
    server_name my.mynet.club;

    # SSL证书配置 (需要根据实际情况调整)
    ssl_certificate /etc/letsencrypt/live/mynet.club-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mynet.club-0001/privkey.pem;

    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全标头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://my.mynet.club;";

    # 网站根目录
    root /data/app/mynet.club/my/public;
    index index.html index.php;

    # 访问日志
    access_log /data/log/nginx/mynet.mynet.club.access.log;
    error_log /data/log/nginx/mynet.mynet.club.error.log;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }

    # 处理单页应用路由
    location / {
        try_files $uri $uri/ /index.html;

        # 防止缓存HTML文件
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
    }

    # API代理 - 代理到本地nginx处理的Laravel应用
    location /api/ {
        proxy_pass https://127.0.0.1:443/api/;
        proxy_http_version 1.1;
        proxy_set_header Host api.mynet.club;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Original-Host $host;
        proxy_read_timeout 240;
        proxy_send_timeout 240;

        # SSL相关配置
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name api.mynet.club;
    }

    # WebSocket支持 - 直接连接PHP启动的WebSocket服务
    # WebSocket服务配置的host是api-mynet.mynet.club，需要正确设置Host头
    location /wss/ {
        proxy_pass http://127.0.0.1:1080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host my.mynet.club;  # WebSocket服务配置的host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host my.mynet.club;  # 前端实际域名
        proxy_set_header Origin https://my.mynet.club;    # WebSocket Origin验证
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 部署信息端点
    location /deployment-info {
        try_files /deployment-info.json =404;
        add_header Content-Type application/json;
    }

    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问备份文件
    location ~ \.(bak|backup|old|orig|save)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
