# Nginx配置示例 - my.mynet.club
# 解决CORS问题的代理配置

server {
    listen 80;
    listen 443 ssl http2;
    server_name my.mynet.club;
    
    # SSL配置
    ssl_certificate /path/to/your/ssl/certificate.crt;
    ssl_certificate_key /path/to/your/ssl/private.key;
    
    # 前端静态文件
    location / {
        root /data/app/mynet.club/my;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # API代理 - 代理到 api.mynet.club
    location /api/ {
        # 保持 /api 路径并代理到实际的API服务器
        proxy_pass https://api.mynet.club;
        
        # 代理头设置
        proxy_set_header Host api.mynet.club;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # WebSocket代理
    location /wss {
        proxy_pass http://backend_websocket_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket超时设置
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# 上游服务器定义（如果WebSocket服务在本地）
upstream backend_websocket_server {
    server 127.0.0.1:1080;  # 根据实际WebSocket服务端口调整
}
