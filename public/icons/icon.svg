<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>
  
  <!-- Network nodes -->
  <circle cx="64" cy="35" r="8" fill="white" opacity="0.9"/>
  <circle cx="35" cy="64" r="8" fill="white" opacity="0.9"/>
  <circle cx="93" cy="64" r="8" fill="white" opacity="0.9"/>
  <circle cx="50" cy="85" r="8" fill="white" opacity="0.9"/>
  <circle cx="78" cy="85" r="8" fill="white" opacity="0.9"/>
  
  <!-- Network connections -->
  <line x1="64" y1="35" x2="35" y2="64" stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="64" y1="35" x2="93" y2="64" stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="35" y1="64" x2="50" y2="85" stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="93" y1="64" x2="78" y2="85" stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="50" y1="85" x2="78" y2="85" stroke="white" stroke-width="3" opacity="0.7"/>
  
  <!-- Center node (larger) -->
  <circle cx="64" cy="64" r="10" fill="white"/>
</svg>
