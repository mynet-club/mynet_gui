openapi: 3.0.3
info:
  title: MyNet API
  description: |
    MyNet 是一个基于 DDD 架构的虚拟网络管理平台 API。
    
    支持功能：
    - 节点管理（Node Management）
    - 路由管理（Route Management）
    - 区域管理（Zone Management）
    - IP 池管理（IP Pool Management）
    - 社交网络（Social Network）
    - 用户管理（User Management）
    - ID 管理（ID Management）
    
    认证方式：
    - Bearer Token (Laravel Sanctum)
    - Session Authentication
    
    Zone 隔离：
    - 所有 API 都基于用户的 Zone 进行数据隔离
    - 确保跨 Zone 访问的安全性
  version: 1.0.0
  contact:
    name: MyNet API Support
    url: https://github.com/mynet-project
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.mynet.com/api/v1
    description: Production server
  - url: https://staging.mynet.com/api/v1
    description: Staging server
  - url: http://localhost:8000/api/v1
    description: Development server

security:
  - bearerAuth: []
  - sessionAuth: []

paths:
  # 认证相关
  /auth/login:
    post:
      tags:
        - Authentication
      summary: 用户登录
      description: 用户登录获取访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: 用户邮箱
                password:
                  type: string
                  format: password
                  description: 用户密码
                device_name:
                  type: string
                  maxLength: 255
                  description: 设备名称
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: 用户登出
      description: 用户登出并撤销令牌
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/verify-token:
    get:
      tags:
        - Authentication
      summary: 验证令牌
      description: 验证当前访问令牌的有效性
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 令牌有效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerifyResponse'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: 用户注册
      description: 用户注册并发送账号激活邮件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - invitation
                - activation_url
              properties:
                name:
                  type: string
                  description: 用户名
                email:
                  type: string
                  format: email
                  description: 用户邮箱
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: 用户密码
                device_name:
                  type: string
                  maxLength: 255
                  description: 设备名称
                invitation:
                  type: string
                  maxLength: 255
                  description: 邀请码
                activation_url:
                  type: string
                  format: uri
                  description: 账号激活页面URL
                  example: "https://app.dsplat.com/activate"
      responses:
        '201':
          description: 注册成功，激活邮件已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '422':
          description: 验证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: 刷新访问令牌
      description: 使用refresh token刷新访问令牌
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: 刷新令牌
      responses:
        '200':
          description: 令牌刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/token/generate:
    post:
      tags:
        - Authentication
      summary: 生成新的API令牌
      description: 为当前用户生成新的API令牌
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 令牌生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateTokenResponse'
        '401':
          description: 用户未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/validate-session:
    post:
      tags:
        - Authentication
      summary: 验证会话状态
      description: 验证会话状态和数据同步
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - token_hash
                - last_sync
                - client_version
                - timestamp
              properties:
                user_id:
                  type: string
                  description: 用户ID
                token_hash:
                  type: string
                  description: 令牌哈希
                last_sync:
                  type: integer
                  description: 最后同步时间戳
                client_version:
                  type: string
                  description: 客户端版本
                timestamp:
                  type: integer
                  description: 当前时间戳
      responses:
        '200':
          description: 会话验证成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateSessionResponse'
        '401':
          description: 用户未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/status:
    get:
      tags:
        - Authentication
      summary: 获取认证状态
      description: 获取当前认证状态（无需认证）
      responses:
        '200':
          description: 认证状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  web_auth:
                    type: boolean
                    description: Web认证状态
                  sanctum_auth:
                    type: boolean
                    description: Sanctum认证状态
                  session_id:
                    type: string
                    description: 会话ID
                  csrf_token:
                    type: string
                    description: CSRF令牌

  # 密码重置相关API
  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: 忘记密码
      description: 发送密码重置邮件到用户邮箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - redirect_url
              properties:
                email:
                  type: string
                  format: email
                  description: 用户邮箱
                  example: "user@example.com"
                redirect_url:
                  type: string
                  format: uri
                  description: 密码重置页面URL
                  example: "https://app.dsplat.com/reset-password"
      responses:
        '200':
          description: 密码重置邮件发送成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "密码重置邮件已发送"
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: "user@example.com"
                      expires_at:
                        type: string
                        format: date-time
                        description: 重置链接过期时间
        '422':
          description: 验证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: 重置密码
      description: 使用令牌重置用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
                - password
                - password_confirmation
              properties:
                email:
                  type: string
                  format: email
                  description: 用户邮箱
                  example: "user@example.com"
                token:
                  type: string
                  description: 密码重置令牌
                  example: "abc123def456"
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: 新密码
                password_confirmation:
                  type: string
                  format: password
                  description: 确认新密码
      responses:
        '200':
          description: 密码重置成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "密码重置成功"
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: "user@example.com"
        '422':
          description: 验证失败或令牌无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/validate-reset-token:
    post:
      tags:
        - Authentication
      summary: 验证重置令牌
      description: 验证密码重置令牌的有效性
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
              properties:
                email:
                  type: string
                  format: email
                  description: 用户邮箱
                  example: "user@example.com"
                token:
                  type: string
                  description: 密码重置令牌
                  example: "abc123def456"
      responses:
        '200':
          description: 令牌验证成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "令牌有效"
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: "user@example.com"
                      expires_at:
                        type: string
                        format: date-time
                        description: 令牌过期时间
        '422':
          description: 令牌无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /auth/cancel-password-reset:
    delete:
      tags:
        - Authentication
      summary: 取消密码重置
      description: 取消用户的密码重置请求
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: 用户邮箱
                  example: "user@example.com"
      responses:
        '200':
          description: 密码重置已取消
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "密码重置已取消"
        '404':
          description: 没有找到重置请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # 账号激活相关API
  /auth/activate-account:
    post:
      tags:
        - Authentication
      summary: 激活账号
      description: 使用激活令牌激活用户账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
              properties:
                email:
                  type: string
                  format: email
                  description: 用户邮箱
                  example: "user@example.com"
                token:
                  type: string
                  description: 账号激活令牌
                  example: "xyz789abc123"
      responses:
        '200':
          description: 账号激活成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "账号激活成功"
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: "user@example.com"
                      activated_at:
                        type: string
                        format: date-time
                        description: 激活时间
        '422':
          description: 激活令牌无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 账号已经激活
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "账号已经激活"

  /auth/resend-activation-email:
    post:
      tags:
        - Authentication
      summary: 重新发送激活邮件
      description: 重新发送账号激活邮件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - activation_url
              properties:
                email:
                  type: string
                  format: email
                  description: 用户邮箱
                  example: "user@example.com"
                activation_url:
                  type: string
                  format: uri
                  description: 账号激活页面URL
                  example: "https://app.dsplat.com/activate"
      responses:
        '200':
          description: 激活邮件发送成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "激活邮件已发送"
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: "user@example.com"
                      expires_at:
                        type: string
                        format: date-time
                        description: 激活链接过期时间
        '422':
          description: 验证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 账号已经激活
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "账号已经激活"

  /auth/check-activation-status:
    get:
      tags:
        - Authentication
      summary: 检查激活状态
      description: 检查指定邮箱的账号激活状态
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
          description: 用户邮箱
          example: "user@example.com"
      responses:
        '200':
          description: 激活状态查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: "user@example.com"
                      is_activated:
                        type: boolean
                        description: 是否已激活
                        example: false
                      activated_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: 激活时间（如果已激活）
                      pending_activation:
                        type: boolean
                        description: 是否有待激活的令牌
                        example: true
                      token_expires_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: 激活令牌过期时间
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # 用户信息
  /user:
    get:
      tags:
        - User
      summary: 获取当前用户信息
      description: 获取当前认证用户的基本信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 用户信息获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'

  # MyNet 统计数据
  /mynet/stats:
    get:
      tags:
        - MyNet
      summary: 获取系统统计数据
      description: 获取系统初始化数据和统计信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 统计数据获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyNetStatsResponse'

  /mynet/health:
    get:
      tags:
        - MyNet
      summary: 获取系统健康状态
      description: 获取系统健康状态和运行状态
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 健康状态获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # 节点管理
  /nodes:
    get:
      tags:
        - Nodes
      summary: 获取节点列表
      description: 获取当前用户在当前 Zone 的节点列表
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
          description: 搜索关键词
        - name: vpn_type
          in: query
          schema:
            type: string
            enum: [gnb, wireguard]
          description: VPN 类型筛选
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1, 2]
          description: 状态筛选
      responses:
        '200':
          description: 节点列表获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeListResponse'

  /nodes/create:
    post:
      tags:
        - Nodes
      summary: 创建新节点
      description: 创建新的节点
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
      responses:
        '201':
          description: 节点创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '422':
          description: 验证错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  # 节点类型定义
  /nodes/types_def:
    get:
      tags:
        - Nodes
      summary: 获取节点类型定义
      description: 获取所有节点类型的定义信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 节点类型定义获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeTypesDefResponse'

  # 节点统计
  /nodes/statistics:
    get:
      tags:
        - Nodes
      summary: 获取节点统计
      description: 获取节点统计信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 节点统计获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeStatisticsResponse'

  /nodes/{id}:
    get:
      tags:
        - Nodes
      summary: 获取节点详情
      description: 获取指定节点的详细信息
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      responses:
        '200':
          description: 节点详情获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '404':
          description: 节点不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Nodes
      summary: 更新节点
      description: 更新指定节点的信息
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeRequest'
      responses:
        '200':
          description: 节点更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'

    delete:
      tags:
        - Nodes
      summary: 删除节点
      description: 删除指定节点
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      responses:
        '200':
          description: 节点删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # 节点状态管理
  /nodes/{id}/status:
    patch:
      tags:
        - Nodes
      summary: 更新节点状态
      description: 更新指定节点的状态
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 节点 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeStatusRequest'
      responses:
        '200':
          description: 节点状态更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'

  /nodes/{id}/status-check:
    get:
      tags:
        - Nodes
      summary: 检查节点配置状态
