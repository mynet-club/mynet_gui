components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Laravel Sanctum Bearer Token
    sessionAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel Session Cookie

  schemas:
    # 通用响应
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "操作成功"
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "操作失败"
        error:
          type: string
          example: "详细错误信息"

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "验证失败"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        to:
          type: integer
        total:
          type: integer

    # 认证相关
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "登录成功"
        data:
          type: object
          properties:
            auth_token:
              type: string
              example: "1|abc123def456..."
            refresh_token:
              type: string
              example: "xyz789refresh..."
            auth_token_expires_in:
              type: integer
              example: 1800
            refresh_token_expires_in:
              type: integer
              example: 604800
            user:
              $ref: '#/components/schemas/User'

    TokenVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Token有效"
        data:
          type: object
          properties:
            valid:
              type: boolean
              example: true
            user_id:
              type: string
              example: "1001"
            expires_at:
              type: string
              format: date-time
              example: "2023-01-01T12:00:00Z"
            is_expiring_soon:
              type: boolean
              example: false
            needs_refresh:
              type: boolean
              example: false

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "注册成功，激活邮件已发送"
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            activation_required:
              type: boolean
              example: true
              description: 是否需要邮箱激活
            activation_expires_at:
              type: string
              format: date-time
              description: 激活链接过期时间
              example: "2024-01-01T12:00:00Z"

    RefreshTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Token刷新成功"
        data:
          type: object
          properties:
            auth_token:
              type: string
              example: "1|abc123def456..."
            refresh_token:
              type: string
              example: "xyz789refresh..."
            auth_token_expires_in:
              type: integer
              example: 1800
            refresh_token_expires_in:
              type: integer
              example: 604800

    GenerateTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Token生成成功"
        data:
          type: object
          properties:
            token:
              type: string
              example: "1|abc123def456..."
            expires_in:
              type: integer
              example: 1800

    ValidateSessionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "会话校验完成"
        data:
          type: object
          properties:
            needs_update:
              type: boolean
              example: false
            updates:
              type: array
              items:
                type: string
              example: ["user_profile", "permissions"]
            session_info:
              type: object
              properties:
                user_id:
                  type: string
                  example: "1001"
                last_activity:
                  type: integer
                  example: 1640995200
                session_valid_until:
                  type: integer
                  example: 1641081600
                server_time:
                  type: integer
                  example: 1640995200
            user_data:
              type: object
              properties:
                user_id:
                  type: string
                  example: "1001"
                name:
                  type: string
                  example: "张三"
                email:
                  type: string
                  example: "zhangsan@example.com"
                zone_id:
                  type: integer
                  example: 1
                permissions:
                  type: array
                  items:
                    type: string
                  example: ["read", "write"]
                updated_at:
                  type: integer
                  example: 1640995200

    # 密码重置和账号激活相关响应
    ForgotPasswordResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "密码重置邮件已发送"
        data:
          type: object
          properties:
            email:
              type: string
              format: email
              example: "user@example.com"
            expires_at:
              type: string
              format: date-time
              description: 重置链接过期时间
              example: "2024-01-01T12:00:00Z"

    ResetPasswordResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "密码重置成功"
        data:
          type: object
          properties:
            email:
              type: string
              format: email
              example: "user@example.com"
            reset_at:
              type: string
              format: date-time
              description: 密码重置时间
              example: "2024-01-01T12:00:00Z"

    ValidateResetTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "重置令牌有效"
        data:
          type: object
          properties:
            email:
              type: string
              format: email
              example: "user@example.com"
            token_valid:
              type: boolean
              example: true
            expires_at:
              type: string
              format: date-time
              description: 令牌过期时间
              example: "2024-01-01T12:00:00Z"
            remaining_time:
              type: integer
              description: 剩余有效时间（秒）
              example: 3600

    ActivateAccountResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "账号激活成功"
        data:
          type: object
          properties:
            email:
              type: string
              format: email
              example: "user@example.com"
            activated_at:
              type: string
              format: date-time
              description: 激活时间
              example: "2024-01-01T12:00:00Z"
            user:
              $ref: '#/components/schemas/User'

    ResendActivationEmailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "激活邮件已重新发送"
        data:
          type: object
          properties:
            email:
              type: string
              format: email
              example: "user@example.com"
            expires_at:
              type: string
              format: date-time
              description: 激活链接过期时间
              example: "2024-01-01T12:00:00Z"

    CheckActivationStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "激活状态查询成功"
        data:
          type: object
          properties:
            email:
              type: string
              format: email
              example: "user@example.com"
            is_activated:
              type: boolean
              description: 是否已激活
              example: false
            activated_at:
              type: string
              format: date-time
              nullable: true
              description: 激活时间（如果已激活）
              example: null
            pending_activation:
              type: boolean
              description: 是否有待激活的令牌
              example: true
            token_expires_at:
              type: string
              format: date-time
              nullable: true
              description: 激活令牌过期时间
              example: "2024-01-01T12:00:00Z"
            user:
              $ref: '#/components/schemas/User'

    UserInfoResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/User'

    # Zone 服务相关
    ZoneService:
      type: object
      properties:
        service_id:
          type: integer
          example: 1001
        service_name:
          type: string
          example: "MyNet VPN"
        service_type:
          type: string
          enum: [gnb_index, music, video, netbridge]
          example: "gnb_index"
        service_status:
          type: string
          enum: [active, inactive, pending]
          example: "active"
        service_description:
          type: string
          example: "提供MyNet VPN服务"
        service_url:
          type: string
          example: "https://vpn.example.com"
        service_port:
          type: integer
          example: 443
        service_protocol:
          type: string
          enum: [http, https, tcp, udp]
          example: "https"
        service_auth_required:
          type: boolean
          example: true
        service_auth_type:
          type: string
          enum: [bearer, basic, none]
          example: "bearer"
        service_auth_token:
          type: string
          example: "Bearer abc123..."
        service_created_by:
          type: integer
          example: 1001
        service_zone_id:
          type: integer
          example: 1
        service_shared_with:
          type: array
          items:
            type: integer
          example: [1002]
        service_approved_by:
          type: integer
          nullable: true
          example: null
        service_approval_status:
          type: string
          enum: [pending, approved, rejected]
          example: "approved"
        service_approval_reason:
          type: string
          example: "服务质量良好"
        service_created_at:
          type: string
          format: date-time
        service_updated_at:
          type: string
          format: date-time

    ZoneServiceListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ZoneService'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ZoneServiceResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ZoneService'

    CreateZoneServiceRequest:
      type: object
      required:
        - service_name
        - service_type
        - service_url
        - service_port
        - service_protocol
        - service_auth_required
        - service_auth_type
      properties:
        service_name:
          type: string
          example: "MyNet VPN"
        service_type:
          type: string
